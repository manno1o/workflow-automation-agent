name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: extraction eval (keyword extractor)
        run: npm run eval
      - if: always()
        run: cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: worker bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/worker
